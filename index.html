<head>

      <!-- OPTIONAL LINKS: add socials / email here later, e.g.
           <ul class="extra-links">

             <li><a href="https://…">Instagram</a></li>
           </ul>
      -->

      <footer class="footer">
        <p>&copy; 2026 Todd Singleton</p>
      </footer>
    </main>
